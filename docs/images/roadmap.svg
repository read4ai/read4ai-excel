<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 235" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="235" rx="12" fill="#0f172a"/>

  <!-- ============ MAIN STREAM ============ -->
  <rect x="30" y="23" width="105" height="64" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="82" y="49" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Excel File</text>
  <text x="82" y="69" text-anchor="middle" fill="#94a3b8" font-size="12">.xlsx · .xls · .csv</text>

  <line x1="140" y1="55" x2="170" y2="55" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="180" y="20" width="115" height="70" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="237" y="50" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">Recipe</text>
  <text x="237" y="68" text-anchor="middle" fill="#94a3b8" font-size="12">strategy + format</text>

  <line x1="300" y1="55" x2="330" y2="55" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="340" y="20" width="110" height="70" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="395" y="60" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">Parse</text>

  <line x1="455" y1="55" x2="485" y2="55" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="495" y="20" width="140" height="70" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="565" y="50" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">AI-Friendly</text>
  <text x="565" y="68" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">Data</text>

  <!-- Direct path: AI-Friendly Data → Ask AI (single document) -->
  <line x1="640" y1="55" x2="825" y2="55" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="732" y="47" text-anchor="middle" fill="#94a3b8" font-size="14">single document</text>

  <rect x="835" y="20" width="100" height="70" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="885" y="60" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">Ask AI</text>

  <line x1="940" y1="55" x2="970" y2="55" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="980" y="30" width="90" height="50" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1025" y="60" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Answer</text>

  <!-- ============ Production path: Data → Chunk/Embed/Knowledge → Ask AI ============ -->
  <polyline points="565,90 565,152 720,152" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="575" y="127" fill="#94a3b8" font-size="13">multiple documents</text>
  <text x="575" y="141" fill="#6b7280" font-size="10">(out of scope)</text>

  <rect x="730" y="117" width="130" height="100" rx="6" fill="#111827" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="795" y="142" text-anchor="middle" fill="#6b7280" font-size="14">Chunk</text>
  <line x1="744" y1="152" x2="846" y2="152" stroke="#1f2937"/>
  <text x="795" y="174" text-anchor="middle" fill="#6b7280" font-size="14">Embed</text>
  <line x1="744" y1="184" x2="846" y2="184" stroke="#1f2937"/>
  <text x="795" y="205" text-anchor="middle" fill="#6b7280" font-size="14">Knowledge</text>

  <polyline points="860,152 885,152 885,90" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>


  <!-- ============ FUTURE — Recipe (below) ============ -->
  <line x1="237" y1="90" x2="237" y2="117" stroke="#6b7280" stroke-width="1"/>
  <rect x="172" y="117" width="130" height="100" rx="6" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
  <text x="237" y="142" text-anchor="middle" fill="#818cf8" font-size="13">hierarchy path</text>
  <line x1="186" y1="152" x2="288" y2="152" stroke="#1f2937"/>
  <text x="237" y="174" text-anchor="middle" fill="#818cf8" font-size="13">more strategies</text>
  <line x1="186" y1="184" x2="288" y2="184" stroke="#1f2937"/>
  <text x="237" y="205" text-anchor="middle" fill="#818cf8" font-size="13">auto-select</text>

  <!-- ============ FUTURE — Parse (below) ============ -->
  <line x1="395" y1="90" x2="395" y2="117" stroke="#6b7280" stroke-width="1"/>
  <rect x="328" y="117" width="134" height="100" rx="6" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
  <text x="395" y="142" text-anchor="middle" fill="#818cf8" font-size="14">sync + async</text>
  <line x1="342" y1="152" x2="448" y2="152" stroke="#1f2937"/>
  <text x="395" y="174" text-anchor="middle" fill="#4ade80" font-size="14">Java 17+</text>
  <line x1="342" y1="184" x2="448" y2="184" stroke="#1f2937"/>
  <text x="395" y="205" text-anchor="middle" fill="#818cf8" font-size="14">Java 11+</text>

  <!-- ============ LEGEND ============ -->
  <circle cx="980" cy="130" r="4" fill="#4ade80"/>
  <text x="990" y="134" fill="#4ade80" font-size="12">now</text>
  <circle cx="980" cy="150" r="4" fill="#818cf8"/>
  <text x="990" y="154" fill="#818cf8" font-size="12">future</text>
</svg>
