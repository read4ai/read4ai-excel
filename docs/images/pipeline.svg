<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="190" rx="12" fill="#0f172a"/>

  <!-- Pipeline outer box -->
  <rect x="15" y="12" width="670" height="166" rx="10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="35" fill="#4ade80" font-size="14" font-weight="bold">Pipeline</text>
  <rect x="100" y="22" width="65" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="132" y="35" text-anchor="middle" fill="#4ade80" font-size="10">balanced</text>
  <text x="172" y="35" fill="#94a3b8" font-size="10">+</text>
  <rect x="182" y="22" width="70" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="217" y="35" text-anchor="middle" fill="#4ade80" font-size="10">Markdown</text>

  <!-- ============ Strategy ============ -->
  <rect x="35" y="48" width="370" height="118" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="50" y="70" fill="#4ade80" font-size="12" font-weight="bold">Strategy</text>

  <!-- Axis 1: Segmenter -->
  <text x="50" y="96" fill="#e2e8f0" font-size="10">Segmenter</text>
  <rect x="130" y="83" width="55" height="20" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="157" y="97" text-anchor="middle" fill="#4ade80" font-size="9">Graph</text>
  <rect x="192" y="83" width="75" height="20" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="229" y="97" text-anchor="middle" fill="#6b7280" font-size="9">ThreeLevel</text>
  <text x="280" y="97" fill="#374151" font-size="9">...</text>

  <!-- Axis 2: Header Detector -->
  <text x="50" y="125" fill="#e2e8f0" font-size="10">Header</text>
  <rect x="130" y="112" width="85" height="20" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="172" y="126" text-anchor="middle" fill="#4ade80" font-size="9">MergeAware</text>
  <rect x="222" y="112" width="75" height="20" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="259" y="126" text-anchor="middle" fill="#6b7280" font-size="9">SingleRow</text>
  <text x="310" y="126" fill="#374151" font-size="9">...</text>

  <!-- Axis 3: Block Orderer -->
  <text x="50" y="154" fill="#e2e8f0" font-size="10">Block Order</text>
  <rect x="130" y="141" width="70" height="20" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="165" y="155" text-anchor="middle" fill="#4ade80" font-size="9">Deferred</text>
  <rect x="207" y="141" width="80" height="20" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="247" y="155" text-anchor="middle" fill="#6b7280" font-size="9">Sequential</text>
  <text x="300" y="155" fill="#374151" font-size="9">...</text>

  <!-- Strategy names -->
  <text x="330" y="96" fill="#4ade80" font-size="10" font-weight="bold">balanced</text>
  <text x="330" y="115" fill="#6b7280" font-size="10">complex</text>
  <text x="330" y="134" fill="#374151" font-size="10">...</text>

  <!-- Arrow -->
  <line x1="415" y1="107" x2="440" y2="107" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ Format ============ -->
  <rect x="455" y="48" width="210" height="118" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="470" y="70" fill="#4ade80" font-size="12" font-weight="bold">Format</text>

  <rect x="470" y="83" width="80" height="24" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="510" y="100" text-anchor="middle" fill="#4ade80" font-size="10">Markdown</text>

  <rect x="470" y="115" width="55" height="24" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="497" y="132" text-anchor="middle" fill="#6b7280" font-size="10">JSON</text>

  <text x="470" y="158" fill="#374151" font-size="10">...</text>
</svg>
