<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="700" height="260" rx="12" fill="#0f172a"/>

  <!-- Pipeline outer box -->
  <rect x="15" y="12" width="670" height="236" rx="10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="35" fill="#4ade80" font-size="14" font-weight="bold">Pipeline</text>
  <rect x="100" y="22" width="65" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="132" y="35" text-anchor="middle" fill="#4ade80" font-size="10">balanced</text>
  <text x="172" y="35" fill="#94a3b8" font-size="10">+</text>
  <rect x="182" y="22" width="50" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="207" y="35" text-anchor="middle" fill="#4ade80" font-size="10">JSON</text>

  <!-- ============ Strategy ============ -->
  <rect x="35" y="48" width="370" height="188" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="50" y="70" fill="#4ade80" font-size="12" font-weight="bold">Strategy</text>

  <!-- Axis 1: WorkbookReader -->
  <text x="50" y="92" fill="#e2e8f0" font-size="10">Workbook</text>
  <rect x="140" y="80" width="50" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="165" y="93" text-anchor="middle" fill="#4ade80" font-size="9">POI</text>

  <!-- Axis 2: GridExtractor -->
  <text x="50" y="117" fill="#e2e8f0" font-size="10">Grid</text>
  <rect x="140" y="105" width="60" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="170" y="118" text-anchor="middle" fill="#4ade80" font-size="9">Default</text>

  <!-- Axis 3: Segmenter -->
  <text x="50" y="142" fill="#e2e8f0" font-size="10">Segmenter</text>
  <rect x="140" y="130" width="55" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="167" y="143" text-anchor="middle" fill="#4ade80" font-size="9">Graph</text>
  <rect x="202" y="130" width="70" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="237" y="143" text-anchor="middle" fill="#6b7280" font-size="9">ThreeLevel</text>

  <!-- Axis 4: HeaderDetector -->
  <text x="50" y="167" fill="#e2e8f0" font-size="10">Header</text>
  <rect x="140" y="155" width="80" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="180" y="168" text-anchor="middle" fill="#4ade80" font-size="9">MergeAware</text>
  <rect x="227" y="155" width="70" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="262" y="168" text-anchor="middle" fill="#6b7280" font-size="9">SingleRow</text>

  <!-- Axis 5: BlockOrderer -->
  <text x="50" y="192" fill="#e2e8f0" font-size="10">Block Order</text>
  <rect x="140" y="180" width="65" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="172" y="193" text-anchor="middle" fill="#4ade80" font-size="9">Deferred</text>
  <rect x="212" y="180" width="75" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="249" y="193" text-anchor="middle" fill="#6b7280" font-size="9">Sequential</text>

  <!-- Axis 6: ElementClassifier -->
  <text x="50" y="217" fill="#e2e8f0" font-size="10">Element</text>
  <rect x="140" y="205" width="60" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="170" y="218" text-anchor="middle" fill="#4ade80" font-size="9">Default</text>

  <!-- Strategy names column -->
  <text x="330" y="92" fill="#4ade80" font-size="10" font-weight="bold">balanced</text>
  <text x="330" y="115" fill="#6b7280" font-size="10">complex</text>
  <text x="330" y="138" fill="#6b7280" font-size="10">structural</text>
  <text x="330" y="161" fill="#6b7280" font-size="10">scattered</text>

  <!-- Connector: Strategy + Format (independent axes) -->
  <text x="427" y="148" text-anchor="middle" fill="#4ade80" font-size="22" font-weight="bold">+</text>

  <!-- ============ Format ============ -->
  <rect x="455" y="48" width="210" height="188" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="470" y="70" fill="#4ade80" font-size="12" font-weight="bold">Format</text>

  <!-- Format axis: JSON (default) / Markdown -->
  <text x="470" y="95" fill="#e2e8f0" font-size="10">Format</text>
  <rect x="535" y="83" width="50" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="560" y="96" text-anchor="middle" fill="#4ade80" font-size="9">JSON</text>
  <rect x="592" y="83" width="65" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="624" y="96" text-anchor="middle" fill="#6b7280" font-size="9">Markdown</text>

  <!-- Layout axis: COMPACT / ROW_OBJECT -->
  <text x="470" y="135" fill="#e2e8f0" font-size="10">Layout</text>
  <rect x="535" y="123" width="55" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="562" y="136" text-anchor="middle" fill="#4ade80" font-size="9">COMPACT</text>
  <rect x="597" y="123" width="65" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="629" y="136" text-anchor="middle" fill="#6b7280" font-size="9">ROW_OBJECT</text>

  <!-- Assist axis: NONE / ON -->
  <text x="470" y="175" fill="#e2e8f0" font-size="10">Assist</text>
  <rect x="535" y="163" width="55" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="562" y="176" text-anchor="middle" fill="#4ade80" font-size="9">NONE</text>
  <rect x="597" y="163" width="50" height="18" rx="3" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
  <text x="622" y="176" text-anchor="middle" fill="#6b7280" font-size="9">ON</text>
</svg>
