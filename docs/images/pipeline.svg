<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="260" rx="12" fill="#0f172a"/>

  <!-- Pipeline outer box -->
  <rect x="15" y="12" width="670" height="236" rx="10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="35" fill="#4ade80" font-size="14" font-weight="bold">Pipeline</text>
  <rect x="100" y="22" width="65" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="132" y="35" text-anchor="middle" fill="#4ade80" font-size="10">balanced</text>
  <text x="172" y="35" fill="#94a3b8" font-size="10">+</text>
  <rect x="182" y="22" width="70" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="217" y="35" text-anchor="middle" fill="#4ade80" font-size="10">Markdown</text>

  <!-- ============ Strategy ============ -->
  <rect x="35" y="48" width="370" height="188" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="50" y="70" fill="#4ade80" font-size="12" font-weight="bold">Strategy</text>

  <!-- Axis 1: WorkbookReader (1 impl) -->
  <text x="50" y="92" fill="#94a3b8" font-size="10">Workbook</text>
  <rect x="140" y="80" width="50" height="18" rx="3" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1" stroke-opacity="0.5"/>
  <text x="165" y="93" text-anchor="middle" fill="#86efac" font-size="9">POI</text>
  <text x="197" y="93" fill="#374151" font-size="9">...</text>

  <!-- Axis 2: GridExtractor (1 impl) -->
  <text x="50" y="117" fill="#94a3b8" font-size="10">Grid</text>
  <rect x="140" y="105" width="60" height="18" rx="3" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1" stroke-opacity="0.5"/>
  <text x="170" y="118" text-anchor="middle" fill="#86efac" font-size="9">Default</text>
  <text x="207" y="118" fill="#374151" font-size="9">...</text>

  <!-- Axis 3: Segmenter -->
  <text x="50" y="142" fill="#e2e8f0" font-size="10">Segmenter</text>
  <rect x="140" y="130" width="55" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="167" y="143" text-anchor="middle" fill="#4ade80" font-size="9">Graph</text>
  <rect x="202" y="130" width="70" height="18" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="237" y="143" text-anchor="middle" fill="#6b7280" font-size="9">ThreeLevel</text>
  <text x="279" y="143" fill="#374151" font-size="9">...</text>

  <!-- Axis 4: HeaderDetector -->
  <text x="50" y="167" fill="#e2e8f0" font-size="10">Header</text>
  <rect x="140" y="155" width="80" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="180" y="168" text-anchor="middle" fill="#4ade80" font-size="9">MergeAware</text>
  <rect x="227" y="155" width="70" height="18" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="262" y="168" text-anchor="middle" fill="#6b7280" font-size="9">SingleRow</text>
  <text x="304" y="168" fill="#374151" font-size="9">...</text>

  <!-- Axis 5: BlockOrderer -->
  <text x="50" y="192" fill="#e2e8f0" font-size="10">Block Order</text>
  <rect x="140" y="180" width="65" height="18" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="172" y="193" text-anchor="middle" fill="#4ade80" font-size="9">Deferred</text>
  <rect x="212" y="180" width="75" height="18" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="249" y="193" text-anchor="middle" fill="#6b7280" font-size="9">Sequential</text>
  <text x="294" y="193" fill="#374151" font-size="9">...</text>

  <!-- Axis 6: ElementClassifier (1 impl) -->
  <text x="50" y="217" fill="#94a3b8" font-size="10">Element</text>
  <rect x="140" y="205" width="60" height="18" rx="3" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1" stroke-opacity="0.5"/>
  <text x="170" y="218" text-anchor="middle" fill="#86efac" font-size="9">Default</text>
  <text x="207" y="218" fill="#374151" font-size="9">...</text>

  <!-- Strategy names column -->
  <text x="330" y="92" fill="#4ade80" font-size="10" font-weight="bold">balanced</text>
  <text x="330" y="115" fill="#6b7280" font-size="10">complex</text>
  <text x="330" y="138" fill="#6b7280" font-size="10">structural</text>
  <text x="330" y="161" fill="#6b7280" font-size="10">scattered</text>
  <text x="330" y="184" fill="#374151" font-size="10">...</text>

  <!-- Arrow -->
  <line x1="415" y1="142" x2="440" y2="142" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ Format ============ -->
  <rect x="455" y="48" width="210" height="188" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="470" y="70" fill="#4ade80" font-size="12" font-weight="bold">Format</text>

  <rect x="470" y="88" width="90" height="24" rx="3" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="515" y="105" text-anchor="middle" fill="#4ade80" font-size="10">Markdown</text>

  <rect x="470" y="120" width="130" height="24" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="535" y="137" text-anchor="middle" fill="#6b7280" font-size="10">JSON compact</text>

  <rect x="470" y="152" width="140" height="24" rx="3" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="540" y="169" text-anchor="middle" fill="#6b7280" font-size="10">JSON row-object</text>

  <text x="470" y="200" fill="#374151" font-size="10">custom DocumentWriter</text>
  <text x="470" y="218" fill="#374151" font-size="10">...</text>
</svg>
